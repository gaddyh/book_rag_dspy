[project]
name = "book-rag-dspy"
version = "0.1.0"
description = "Book RAG system using DSPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dspy[numpy]",
    "pymupdf",
    "python-dotenv"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_rag"]
